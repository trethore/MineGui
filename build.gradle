import tytoo.minegui.UnpackSourcesTask

plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

// version
def computeCompatSuffix() {
    def mcVersion = project.property('minecraft_version')
    def fabricVer = project.property('fabric_version')
    def yarnMappings = project.property('yarn_mappings')

    def yarnSuffix = yarnMappings.startsWith("${mcVersion}+") ?
            yarnMappings.substring(("${mcVersion}+").length()) :
            yarnMappings

    return "${fabricVer}+${yarnSuffix}"
}


version = "${project.mod_version}-${computeCompatSuffix()}"

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenLocal()
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets() // so client source set is created
}

def clientSS = sourceSets.named('client')
sourceSets {
    debug {
        java.srcDir 'src/debug/java'
        resources.srcDir 'src/debug/resources'
        // Inherit classpaths + compiled output from client
        compileClasspath += clientSS.get().compileClasspath + clientSS.get().output
        runtimeClasspath += clientSS.get().runtimeClasspath + clientSS.get().output
    }
}
loom {
    mods {
        "mcwebui" {
            sourceSet sourceSets.named('client').get()
        }
        "mcwebuidebug" {
            sourceSet sourceSets.named('debug').get()
        }
    }

    runs {
        client {
            client()
            source sourceSets.named('client').get()
            ideConfigGenerated true
        }
        debugClient {
            client()
            source sourceSets.named('debug').get()
            ideConfigGenerated true
        }
    }
}

configurations {
    sourceDeps
    cfr
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    //cfr
    cfr "org.benf:cfr:0.152"

    //lombok
    compileOnly "org.projectlombok:lombok:${project.lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${project.lombokVersion}"
    clientCompileOnly "org.projectlombok:lombok:${project.lombokVersion}"
    clientAnnotationProcessor "org.projectlombok:lombok:${project.lombokVersion}"

    // imgui
    shadow(implementation fileTree('libs') { include '*.jar' })
    sourceDeps fileTree('libs-dev') { include '*-sources.jar' }

}

tasks.named("processClientResources").configure {
    def version = project.version
    inputs.property("version", version)
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.named("processDebugResources").configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def version = project.version
    inputs.property("version", version)
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

// java
tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
    exclude 'tytoo/minegui_debug/**'
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            groupId = project.maven_group
            artifactId = project.archives_base_name
            version = project.version
            def gitUrl = "https://github.com/trethore/MineGui"

            artifact(tasks.named("remapJar")) {
                builtBy(tasks.named("remapJar"))
            }
            artifact(tasks.named("sourcesJar")) {
                builtBy(tasks.named("sourcesJar"))
                classifier = 'sources'
            }

            pom {
                name = project.archives_base_name
                description = "MineGui: is a lightweight wrapper around imgui-java to make modern uis."
                url.set(gitUrl)
                licenses {
                    license {
                        name = "MIT License"
                        url = "https://opensource.org/licenses/MIT"
                    }
                }
                scm {
                    url = gitUrl
                    connection.set("scm:git:${gitUrl}.git")
                    developerConnection = "scm:git:ssh://git@github.com/trethore/McWebUI.git"
                }
            }
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/trethore/MineGui")
            credentials {
                username = System.getenv("GITHUB_ACTOR") ?: (findProperty("gpr.user") ?: "")
                password = System.getenv("GITHUB_TOKEN") ?: (findProperty("gpr.key") ?: "")
            }
        }
    }
}

shadowJar {
    configurations = [project.configurations.shadow]
    archiveClassifier.set("dev")
    from sourceSets.client.output
}
remapJar {
    dependsOn(shadowJar)
    inputFile = tasks.shadowJar.archiveFile
}

// --- Source browsing helpers ---

def unpackedSourcesDir = layout.projectDirectory.dir("libs-src")
def sourceDepsConfig = configurations.named('sourceDeps')
def cfrConfig = configurations.named('cfr')
def minecraftCacheDirProvider = layout.projectDirectory.dir(".gradle/loom-cache/minecraftMaven")
def fabricCacheDirProvider = layout.projectDirectory.dir(".gradle/loom-cache/remapped_mods/remapped/net/fabricmc/fabric-api")

tasks.register('cleanSources', Delete) {
    group = "help"
    description = "Deletes unpacked sources in libs-src/"
    delete unpackedSourcesDir
}

tasks.register('unpackSources', UnpackSourcesTask) {
    group = "help"
    description = "Unpacks library, Minecraft, and Fabric sources into libs-src/"
    dependsOn tasks.named('cleanSources')
    sourceDeps.from(sourceDepsConfig)
    cfrClasspath.from(cfrConfig)
    outputDir.set(unpackedSourcesDir)
    minecraftCacheDir.set(minecraftCacheDirProvider)
    fabricCacheDir.set(fabricCacheDirProvider)
}